name: VINLUX Media Update

on:
  workflow_dispatch:
    inputs:
      facture:
        description: 'Folder name in Google Drive'
        required: true
        default: 'mat-serebro-temnoe'

jobs:
  media:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download media from Google Drive
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python scripts/download_drive.py "${{ github.event.inputs.facture }}"
